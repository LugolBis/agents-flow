[package]
name = "agents-flow"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Secure multi-agent crew : centralised permissions, tool-side guardrails, audit for multi-platform usages (Windows ARM64 + Linux ARM64)."
license = "MIT"

[lib]
name = "agents_flow"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "agwo"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
url = "2"
ureq = "3"
scraper = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
lopdf = { version = "0.34", default-features = false, features = [
    "nom_parser",
] }
similar = "2"
csv = "1"
imagesize = "0.13"
same-file = "1"
tar = { version = "0.4", default-features = false }
toml = "0.8"
tempfile = "3"
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# panic stays "unwind": lopdf can panic on hostile PDFs and we contain it with catch_unwind.

[profile.dev]
opt-level = 1
