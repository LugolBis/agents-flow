# Windows MSVC (x64 and ARM64): link the C runtime statically so the .exe runs without the VC++ redistributable.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# Cross-compiling for Linux ARM64 from an x86-64 host (e.g. to feed `agwo wsl sync`):
#   rustup target add aarch64-unknown-linux-gnu && sudo apt install gcc-aarch64-linux-gnu
#   cargo build --release --target aarch64-unknown-linux-gnu
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
